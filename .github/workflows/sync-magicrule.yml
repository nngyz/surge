name: Sync MagicRule sections

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing upstream rules
        id: sync
        run: python3 scripts/sync_magicrule.py
      - name: Create pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/magicrule-sync
          delete-branch: true
          title: 'chore: add missing MagicRule rules'
          commit-message: 'chore: add missing MagicRule rules'
          body: |
            Adds missing upstream rules without removing existing rules.
            Review rule order and upstream changes before merging.
